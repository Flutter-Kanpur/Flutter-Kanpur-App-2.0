name: flutter_knp_mobile_app_v2
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.2.0
  supabase_flutter: ^2.12.4
  flutter_dotenv: ^6.0.1
  flutter_quill: ^11.5.1
  flutter_riverpod: ^3.3.1
  easy_localization: ^3.0.8
  flutter_kanpur_ui_kit: ^0.0.13
  flutter_svg: ^2.3.0
  flutter_screenutil: ^5.9.3
  google_fonts: ^7.1.0
  # Commented out: never imported, and it pulled GoogleSignIn 9 -> AppCheckCore
  # 11 -> GoogleUtilities 8.x, which conflicts with firebase_messaging's
  # GoogleUtilities ~> 7.8 and broke every iOS pod install. Google auth goes
  # through Supabase browser OAuth (AuthRemoteDataSource.signInWithGoogle),
  # which needs no native SDK. Re-enable only alongside a Firebase 11.x bump.
  # google_sign_in: ^7.2.0
  image_picker: ^1.2.2
  carousel_slider: ^5.1.2
  new_version_plus: ^0.1.1
  file_picker: ^8.3.7
  go_router: ^17.2.3
  http: ^1.2.2
  connectivity_plus: ^7.1.1
  firebase_remote_config: ^4.4.7
  equatable: ^2.0.8
  cached_network_image: ^3.3.1
  firebase_messaging: ^14.7.0
  device_info_plus: ^10.1.2
  share_plus: ^12.0.1
  add_2_calendar: 3.0.1
  shared_preferences: ^2.5.5
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  path: ^1.9.1
  video_player: ^2.10.0
  # Was already imported by manage_profile_header / app_update_service and
  # resolving only as a transitive dependency.
  url_launcher: ^6.3.1
  speech_to_text: ^7.3.0

  # Blogs product (Flutter Kanpur ReadMe)
  Readme:
    git:
      url: https://github.com/Flutter-Kanpur/readmeApp.git
      ref: release-1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true


  assets:
    - .env
    - assets/
    - assets/icons/
    - assets/profile/
    - assets/contributor/
    - assets/translations/en.json
    - assets/translations/hi.json

  fonts:
    - family: ProductSans
      fonts:
        - asset: assets/fonts/Product Sans/ProductSans-Light.ttf
          weight: 300
        - asset: assets/fonts/Product Sans/ProductSans-Light.ttf
          weight: 400
        - asset: assets/fonts/Product Sans/ProductSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/Product Sans/ProductSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/Product Sans/ProductSans-Black.ttf
          weight: 900
